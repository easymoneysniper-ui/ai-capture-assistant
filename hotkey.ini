# ===============================================================
#  AI 截图助手 - 配置文件
#  改完保存 -> 托盘右键「退出」-> 重新双击「启动全局热键.bat」
# ===============================================================

# 【热键】修饰键 + 主键，用 + 连接
#   修饰键：Ctrl / Alt / Shift / Win（可组合）
#   主键  ：A-Z、0-9、F1-F12
#   示例  ：Ctrl+Alt+S / Alt+Shift+A / Ctrl+Shift+F9
Hotkey = Ctrl+Alt+S

# 【模式】截图方式
#   region = 框选（推荐）
#   full   = 直接截整屏
Mode = region

# 【复制到剪贴板】1 = 开启，0 = 关闭
CopyImage = 1

# 【自动投递网页】截图后自动把图送到已打开的助手网页，并自动开始翻译
#   1 = 开启（网页开着时，按快捷键截图 -> 直接出译文）
#   0 = 关闭（截图只存本地）
AutoSend = 1

# 【自动打开网页】截图后自动打开助手网页
#   一般用 AutoSend 就够了，这个设 0 即可
AutoOpen = 0

# 【助手页面地址】改了端口才需要动
Url = http://127.0.0.1:8787/ai-capture-assistant.html
